# ==========================================
# LEADER GYM API - PRODUCCIÓN (PRD)
# Autor: Joaquin Leonardo Labrador Velasco
# ==========================================

spring.application.name=leader-gym

# ===============================
# SERVER
# ===============================
# Railway inyecta PORT automáticamente
server.port=${PORT:8080}

# Si luego usas proxy/reverse proxy (Railway)
server.forward-headers-strategy=framework

# ===============================
# DATASOURCE (MySQL)
# ===============================
# IMPORTANTE: en PRD NO usar defaults con credenciales locales
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones (Hikari)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / HIBERNATE
# ===============================
# En producción evitar 'update' para no romper esquema/datos
spring.jpa.hibernate.ddl-auto=validate

# Opcional (útil si hubo problemas de detección de dialecto)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Menos ruido en logs en PRD
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Recomendado para APIs REST
spring.jpa.open-in-view=false

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# ===============================
# ERRORES (API)
# ===============================
# En producción evita exponer detalles internos
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never